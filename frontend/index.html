<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="google-site-verification" content="h2WPNnTVyTsYd3yIjp-qlhWKoSpTZO9zdNmQAlEall4" />

    <meta
      name="description"
      content="Ask about any crisis, generate M&amp;E situation and technical reports, and see the indicators behind them. Every claim links to the report it came from."
    />
    <title>Humanitaria</title>
  </head>
  <body>
    <!-- For readers that do not run JavaScript (Google's OAuth brand check among
         them). The build replaces this block with each prerendered page's own text
         (privacy.html), see scripts/staticPages.js. -->
    <noscript id="static-content">
      <main>
        <h1>Humanitaria</h1>
        <p>Ask the humanitarian record. Get answers you can cite.</p>
        <p>
          Humanitaria is a research tool for people who monitor humanitarian crises: monitoring and
          evaluation (M&amp;E) staff, analysts, researchers and journalists. It answers questions
          about a crisis from public ReliefWeb reports, and every answer links to the reports it
          came from. It also writes M&amp;E reports for a country, sector and period: situation
          reports, indicator monitoring, needs assessment briefs and technical monitoring reports
          built from HDX HAPI data.
        </p>
        <p>
          You can create an account with an email address and a password, or sign in with Google.
          Google sign-in is used only to create your account and sign you in. We receive your name,
          email address and Google account ID, and we request no other Google data.
        </p>
        <p>Humanitaria needs JavaScript to run. Read our <a href="/privacy">privacy policy</a>.</p>
      </main>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
