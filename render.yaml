# Render Blueprint — one Docker web service (FastAPI API + built Vue SPA).
# Free tier: ephemeral disk (SQLite users/conversations reset on sleep/deploy)
# and spins down after ~15 min idle. See DEPLOY.md.
services:
  - type: web
    name: humanitaria
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Production behavior (HTTPS, same-origin SPA, no background ingestion).
      - key: ENVIRONMENT           # hides /docs, fail-fast on insecure default secret
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: INGEST_SCHEDULE_HOURS   # no in-process scheduler; the Cloudflare Worker cron triggers ingest
        value: "0"
      - key: GEMINI_REASONING_EFFORT
        value: low
      # All-country × last-1-year corpus + daily rolling-window retention
      # (ingest via Cloudflare Worker cron → POST /admin/ingest/cron).
      # Vector index = Supabase pgvector (DATABASE_URL); EMBED_DIM must match the
      # chunks.embedding column (halfvec(768)).
      - key: EMBED_DIM
        value: "768"
      - key: RETENTION_DAYS
        value: "365"
      - key: RETENTION_PER_COUNTRY_CAP
        value: "200"
      # Observed XFF on Render (2026-11): client, Cloudflare edge, Render internal 10.x
      # → real client IP = 3rd entry from the right. 1 keyed every user on 10.x.
      - key: RATE_LIMIT_TRUSTED_HOPS
        value: "3"
      # URLs assume the predicted host below. If Render appends a suffix to the
      # name, update these three + the Google redirect URI (see DEPLOY.md).
      - key: FRONTEND_URL
        value: https://humanitaria.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://humanitaria.onrender.com/auth/google/callback
      - key: CORS_ORIGINS
        value: https://humanitaria.onrender.com
      # Render generates a strong session-signing secret automatically.
      - key: AUTH_SESSION_SECRET
        generateValue: true
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL           # Supabase Postgres (session pooler URI): app tables + pgvector index
        sync: false
      - key: INGEST_TRIGGER_TOKEN   # shared secret for POST /admin/ingest/cron (Cloudflare Worker)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY       # hosted reranker only (Pinecone Inference)
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: HDX_APP_IDENTIFIER   # base64(appname:email) for HDX HAPI (technical report); not secret but personal
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
